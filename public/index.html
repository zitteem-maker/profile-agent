<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <meta name="color-scheme" content="light">
  <title>Emeline Zitte — Agent de profil</title>
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-name">Emeline Zitte</span>
      <span class="brand-sub" data-i18n="brandSub"></span>
    </div>
    <div class="topbar-actions">
      <button type="button" class="btn-ghost" id="lang-toggle" aria-label="Changer de langue / Change language">EN</button>
      <button type="button" class="btn-primary btn-small" id="contact-open" data-i18n="contact"></button>
    </div>
  </header>

  <main id="main">
    <p class="loading" id="loading" data-i18n="loading"></p>
    <p class="banner-error" id="global-error" role="alert" hidden></p>

    <!-- Formulaire d'entrée -->
    <section id="entry" class="card entry" hidden aria-labelledby="entry-title">
      <h1 id="entry-title" data-i18n="entryTitle"></h1>
      <p class="entry-intro" data-i18n="entryIntro"></p>
      <p class="notice-ok" id="deleted-ok" role="status" hidden data-i18n="deletedOk"></p>

      <form id="entry-form" novalidate>
        <div class="grid-2">
          <label class="field">
            <span data-i18n="firstName"></span>
            <input name="firstName" autocomplete="given-name" required maxlength="80">
          </label>
          <label class="field">
            <span data-i18n="lastName"></span>
            <input name="lastName" autocomplete="family-name" required maxlength="80">
          </label>
        </div>
        <label class="field">
          <span data-i18n="company"></span>
          <input name="company" autocomplete="organization" required maxlength="120">
        </label>
        <label class="field">
          <span data-i18n="role"></span>
          <input name="role" autocomplete="organization-title" required maxlength="120">
        </label>
        <label class="field">
          <span data-i18n="email"></span>
          <input name="email" type="email" autocomplete="email" required maxlength="254">
        </label>
        <label class="field">
          <span><span data-i18n="phone"></span> <span class="optional" data-i18n="optional"></span></span>
          <input name="phone" type="tel" autocomplete="tel" maxlength="30">
        </label>

        <div class="notice" id="notice" aria-live="polite"></div>

        <label class="consent">
          <input type="checkbox" name="consent" id="consent">
          <span><span data-i18n="consentText"></span> <a href="/privacy.html" target="_blank" rel="noopener" data-i18n="privacyLink"></a>.</span>
        </label>

        <div id="turnstile-box" class="turnstile"></div>

        <p class="form-error" id="form-error" role="alert" hidden></p>
        <button type="submit" class="btn-primary btn-block" id="entry-submit" disabled data-i18n="start"></button>
        <p class="hint" id="submit-hint" data-i18n="submitHint"></p>
      </form>
    </section>

    <!-- Chat -->
    <section id="chat" class="chat" hidden aria-label="Chat">
      <details class="welcome card" id="welcome" open>
        <summary data-i18n="about"></summary>
        <p id="welcome-text"></p>
      </details>

      <nav class="themes" aria-label="FAQ">
        <div class="theme-row" id="theme-row" role="tablist"></div>
        <div class="theme-panel" id="theme-panel" hidden></div>
      </nav>

      <div class="messages" id="messages" aria-live="polite"></div>

      <form class="composer" id="composer">
        <div class="composer-meta">
          <span id="questions-left" class="counter"></span>
          <button type="button" class="link-danger" id="delete-open" data-i18n="deleteData"></button>
        </div>
        <div class="composer-row">
          <label for="message" class="sr-only" data-i18n="yourQuestion"></label>
          <textarea id="message" rows="1" maxlength="1000" data-i18n-placeholder="placeholder"></textarea>
          <button type="submit" class="btn-primary" id="send" data-i18n="send"></button>
        </div>
        <p class="form-error" id="chat-error" role="alert" hidden></p>
        <p class="disclaimer" id="disclaimer"></p>
      </form>
    </section>
  </main>

  <footer class="footer">
    <a href="/privacy.html" data-i18n="privacy"></a>
    <span aria-hidden="true">·</span>
    <a href="/construction.html" data-i18n="howBuilt"></a>
  </footer>

  <!-- Contact -->
  <dialog id="contact-dialog" class="dialog" aria-labelledby="contact-title">
    <h2 id="contact-title" data-i18n="contactTitle"></h2>
    <ul class="contact-list">
      <li><a id="contact-calendly" target="_blank" rel="noopener" class="btn-primary btn-block" data-i18n="calendly"></a></li>
      <li><a id="contact-email" class="btn-outline btn-block"></a></li>
      <li><a id="contact-whatsapp" target="_blank" rel="noopener" class="btn-outline btn-block">WhatsApp</a></li>
    </ul>
    <button type="button" class="btn-ghost btn-block" data-close data-i18n="close"></button>
  </dialog>

  <!-- Confirmation de suppression -->
  <dialog id="delete-dialog" class="dialog" aria-labelledby="delete-title">
    <h2 id="delete-title" data-i18n="deleteTitle"></h2>
    <p data-i18n="deleteBody"></p>
    <div class="dialog-actions">
      <button type="button" class="btn-ghost" data-close data-i18n="cancel"></button>
      <button type="button" class="btn-danger" id="delete-confirm" data-i18n="deleteConfirm"></button>
    </div>
  </dialog>
</body>
</html>
